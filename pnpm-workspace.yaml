packages:
  - packages/*
  - apps/*

# Межпакетные зависимости внутри workspace объявляются протоколом `workspace:`
# (catalog-react → catalog-schemas: `workspace:^`): линковка не зависит от
# semver-диапазона и не ломается при version:bump (диапазон `^0.5.0` после
# бампа схем на 0.6.0 переставал матчиться → CI собирал react без схем).
# В publish pnpm сам переписывает `workspace:^` в `^{версия}`.
# linkWorkspacePackages оставлен для semver-зависимостей на всякий случай.
linkWorkspacePackages: true