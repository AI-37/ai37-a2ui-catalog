name: CD

on:
  push:
    tags:
      - 'v*'
  # Раннер (канон AI-37): ручной запуск с runner=ubuntu-latest или ai37-self-hosted выбирает
  # явно; auto и автозапуск берут переменную организации CD_RUNNER — раннер деплоя и публикации (CD),
  # JSON-массив меток, напр. ["self-hosted","ai37-local-1"]; без неё — ubuntu-latest.
  workflow_dispatch:
    inputs:
      publish_npm:
        description: Publish npm packages
        required: true
        default: true
        type: boolean
      publish_pypi:
        description: Publish the Python package to PyPI
        required: true
        default: true
        type: boolean
      runner:
        description: "Runner: auto = переменная CD_RUNNER, иначе ubuntu-latest"
        type: choice
        required: true
        default: auto
        options:
          - auto
          - ubuntu-latest
          - ai37-self-hosted

jobs:
  ci:
    name: Reuse CI
    uses: ./.github/workflows/ci.yml
    # Ручной CD на ubuntu-latest/ai37-self-hosted гонит и CI там же; по тегу inputs пусты → auto.
    with:
      runner: ${{ inputs.runner || 'auto' }}
    secrets: inherit

  release_metadata:
    name: Resolve release metadata
    runs-on: ${{ inputs.runner == 'ai37-self-hosted' && fromJSON('["self-hosted", "ai37-local-1"]') || inputs.runner == 'ubuntu-latest' && 'ubuntu-latest' || vars.CD_RUNNER && fromJSON(vars.CD_RUNNER) || 'ubuntu-latest' }}
    needs:
      - ci
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Resolve version
        id: meta
        run: |
          package_version=$(node -e "console.log(JSON.parse(require('fs').readFileSync('packages/catalog-schemas/package.json', 'utf8')).version)")

          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            tag_version=${GITHUB_REF_NAME#v}
            if [[ "$tag_version" != "$package_version" ]]; then
              echo "Git tag version ($tag_version) does not match package version ($package_version)." >&2
              exit 1
            fi
          fi

          echo "version=$package_version" >> "$GITHUB_OUTPUT"

  publish_npm:
    name: Publish npm packages
    runs-on: ${{ inputs.runner == 'ai37-self-hosted' && fromJSON('["self-hosted", "ai37-local-1"]') || inputs.runner == 'ubuntu-latest' && 'ubuntu-latest' || vars.CD_RUNNER && fromJSON(vars.CD_RUNNER) || 'ubuntu-latest' }}
    needs:
      - release_metadata
    if: ${{ needs.release_metadata.result == 'success' && (github.event_name != 'workflow_dispatch' || inputs.publish_npm) }}
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.29.3

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: ${{ runner.environment != 'self-hosted' }}

      - name: Install dependencies
        env:
          AI37_NPM_TOKEN: ${{ secrets.AI37_NPM_TOKEN }}
        run: pnpm install --frozen-lockfile

      - name: Build npm packages
        env:
          AI37_NPM_TOKEN: ${{ secrets.AI37_NPM_TOKEN }}
        run: pnpm -r --filter './packages/**' run build

      - name: Publish @ai37/a2ui-catalog-schemas
        env:
          AI37_NPM_TOKEN: ${{ secrets.AI37_NPM_TOKEN }}
        run: pnpm --filter @ai37/a2ui-catalog-schemas publish --no-git-checks --registry https://npm.app.sp-ai.ru/

      - name: Publish @ai37/a2ui-catalog-react
        env:
          AI37_NPM_TOKEN: ${{ secrets.AI37_NPM_TOKEN }}
        run: pnpm --filter @ai37/a2ui-catalog-react publish --no-git-checks --registry https://npm.app.sp-ai.ru/

  publish_pypi:
    name: Publish Python package
    runs-on: ${{ inputs.runner == 'ai37-self-hosted' && fromJSON('["self-hosted", "ai37-local-1"]') || inputs.runner == 'ubuntu-latest' && 'ubuntu-latest' || vars.CD_RUNNER && fromJSON(vars.CD_RUNNER) || 'ubuntu-latest' }}
    needs:
      - release_metadata
    if: ${{ needs.release_metadata.result == 'success' && (github.event_name != 'workflow_dispatch' || inputs.publish_pypi) }}
    permissions:
      contents: read
    # Все run-шаги — из каталога пакета. НЕ используем `poetry -C <dir>`: с src-layout
    # (packages from="src") в poetry-core 2.x флаг -C удваивает путь → ищет src/src/… и падает.
    defaults:
      run:
        working-directory: packages/catalog-python
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      # Poetry — официальным установщиком (install.python-poetry.org), версия = та, что сгенерировала
      # poetry.lock. POETRY_HOME в runner.temp: каталог чистится после каждой джобы, поэтому на
      # self-hosted раннере ничего не копится в ~/.local и не ломается, когда из toolcache удаляют
      # Python, на котором был поставлен инструмент (так сломался прежний `pipx install poetry`).
      # До setup-python (cache: poetry вычисляет ключ кэша через сам poetry, он обязан быть в PATH
      # заранее) — на системном python3; окружение пакета poetry всё равно создаёт на Python 3.13
      # из setup-python (virtualenvs.use-poetry-python=false).
      - name: Install Poetry
        shell: bash
        timeout-minutes: 10
        env:
          POETRY_HOME: ${{ runner.temp }}/poetry
          POETRY_VERSION: 2.3.2
        # Сеть раннера иногда залипает (30.10 curl висел 5 минут, джоба ушла в таймаут). Поэтому у curl
        # таймауты и повторы, а установку целиком повторяем до трёх раз. Установщик сам качает Poetry с
        # PyPI, и запрос метаданных у него без таймаута, поэтому он ограничен `timeout 180`. Скрипт
        # сохраняется в файл: упавший curl не превратится в «успешный» пустой скрипт.
        run: |
          for attempt in 1 2 3; do
            curl -fsSL --retry 3 --retry-all-errors --connect-timeout 20 --max-time 120 \
              -o "$RUNNER_TEMP/install-poetry.py" https://install.python-poetry.org \
              && timeout 180 python3 "$RUNNER_TEMP/install-poetry.py" && break
            [ "$attempt" -eq 3 ] && exit 1
            echo "::warning::Poetry: попытка $attempt не удалась, повторяю"
            rm -rf "$POETRY_HOME"; sleep 15
          done
          echo "$POETRY_HOME/bin" >> "$GITHUB_PATH"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: poetry
          # cache-dependency-path — это with:, резолвится от корня репо (не от working-directory)
          cache-dependency-path: packages/catalog-python/poetry.lock

      # twine — pip-ом в Python из setup-python, а не через pipx: pipx self-hosted раннера живёт на
      # Python хоста и ломается вместе с ним (как прежний `pipx install poetry`).
      - name: Install Twine
        run: python -m pip install twine

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Build Python package
        run: poetry build

      - name: Check Python package
        run: twine check dist/*

      - name: Publish Python package
        env:
          TWINE_USERNAME: ci-publish
          TWINE_PASSWORD: ${{ secrets.AI37_PYPI_TOKEN }}
        run: twine upload --repository-url https://pypi.app.sp-ai.ru/ dist/*
