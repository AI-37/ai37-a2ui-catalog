name: CI

on:
  pull_request:
  # Из cd.yml: ручной CD передаёт свой выбор раннера, чтобы CI-джобы шли туда же.
  workflow_call:
    inputs:
      runner:
        description: "Runner: auto = переменная CI_RUNNER, иначе ubuntu-latest"
        type: string
        required: false
        default: auto
  # Раннер (канон AI-37): ручной запуск с runner=ubuntu-latest или ai37-self-hosted выбирает
  # явно; auto и автозапуск берут переменную организации CI_RUNNER — раннер тестов (CI),
  # JSON-массив меток, напр. ["self-hosted","ai37-local-1"]; без неё — ubuntu-latest.
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner: auto = переменная CI_RUNNER, иначе ubuntu-latest"
        type: choice
        required: true
        default: auto
        options:
          - auto
          - ubuntu-latest
          - ai37-self-hosted
jobs:
  # Одна джоба: раннер подбирает прогон один раз, и PR разблокируется сразу после последнего шага.
  # Отдельный агрегатор вставал на единственном self-hosted раннере в очередь за чужими джобами и
  # держал PR красным уже после зелёных проверок. Имя ci-green — единое для всех репозиториев AI-37
  # и обязательная проверка ruleset (docs/plans/doc-bot-pr-review.md).
  ci-green:
    runs-on: ${{ inputs.runner == 'ai37-self-hosted' && fromJSON('["self-hosted", "ai37-local-1"]') || inputs.runner == 'ubuntu-latest' && 'ubuntu-latest' || vars.CI_RUNNER && fromJSON(vars.CI_RUNNER) || 'ubuntu-latest' }}
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Poetry
        run: pipx install poetry==2.3.2

      - name: Install Node.js dependencies
        env:
          AI37_NPM_TOKEN: ${{ secrets.AI37_NPM_TOKEN }}
        run: pnpm install --frozen-lockfile

      - name: Install Python dependencies
        run: poetry -C packages/catalog-python install --no-interaction

      # TODO: временно отключено, включить обратно
      # - name: Validate PR version and changelog updates
      #   if: ${{ github.event_name == 'pull_request' }}
      #   env:
      #     BASE_SHA: ${{ github.event.pull_request.base.sha }}
      #     HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      #   run: node scripts/check-pr-release-metadata.mjs "$BASE_SHA" "$HEAD_SHA"

      - name: Run TypeScript tests
        run: pnpm run test:ts

      - name: Run Python tests
        run: pnpm run test:python

      - name: Run build
        run: pnpm run build

      # Guard: закоммиченный ./public должен совпадать с исходником текущей версии каталога.
      # Падает, если забыли `pnpm run export:public` + commit после правки компонентов/бампа версии.
      - name: Verify ./public is up to date with source
        run: pnpm run verify:public
