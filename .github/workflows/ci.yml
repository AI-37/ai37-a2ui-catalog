name: CI

on:
  pull_request:
  # Ручной запуск — чтобы можно было прогнать CI на self-hosted раннере
  # (например когда исчерпаны минуты GitHub-hosted). На push/PR input не задан,
  # inputs.runner пуст → все джобы идут на ubuntu-latest как раньше.
  workflow_dispatch:
    inputs:
      runner:
        description: Runner for CI jobs
        type: choice
        required: true
        default: ubuntu-latest
        options:
          - ubuntu-latest
          - ai37-self-hosted
  workflow_call:
jobs:
  test:
    runs-on: ${{ inputs.runner == 'ai37-self-hosted' && fromJSON('["self-hosted", "ai37-local-1"]') || 'ubuntu-latest' }}
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Poetry
        run: pipx install poetry==2.3.2

      - name: Install Node.js dependencies
        env:
          AI37_NPM_TOKEN: ${{ secrets.AI37_NPM_TOKEN }}
        run: pnpm install --frozen-lockfile

      - name: Install Python dependencies
        run: poetry -C packages/catalog-python install --no-interaction

      # TODO: временно отключено, включить обратно
      # - name: Validate PR version and changelog updates
      #   if: ${{ github.event_name == 'pull_request' }}
      #   env:
      #     BASE_SHA: ${{ github.event.pull_request.base.sha }}
      #     HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      #   run: node scripts/check-pr-release-metadata.mjs "$BASE_SHA" "$HEAD_SHA"

      - name: Run TypeScript tests
        run: pnpm run test:ts

      - name: Run Python tests
        run: pnpm run test:python

      - name: Run build
        run: pnpm run build

      # Guard: закоммиченный ./public должен совпадать с исходником текущей версии каталога.
      # Падает, если забыли `pnpm run export:public` + commit после правки компонентов/бампа версии.
      - name: Verify ./public is up to date with source
        run: pnpm run verify:public

  # Aggregate "green" check with a UNIFORM name across all AI-37 repos, so one org/branch ruleset can
  # require a single context (`ci-green`) regardless of each repo's job names, and the doc-bot review
  # trigger keys off it. Fails if any real CI job above failed or was cancelled.
  ci-green:
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: gate
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "one or more required CI jobs did not succeed"; exit 1
