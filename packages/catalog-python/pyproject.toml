[project]
name = "ai37-a2ui-catalog"
version = "0.48.0"
description = "Pydantic models and validation helpers for the AI37 A2UI catalog"
readme = "README.md"
authors = [{ name = "AI37", email = "dev@ai37.ru" }]
requires-python = ">=3.13,<4.0"
dependencies = [
	"pydantic>=2.11.7,<3.0.0"
]

[tool.poetry.dependencies]


[tool.poetry]
packages = [{ include = "ai37_a2ui_catalog", from = "src" }]
# HTML view не в git (его собирает packages/mcp-app-view), поэтому poetry сам его
# не возьмёт — указываем явно. Без сборки view пакет не собрать: так и задумано.
include = [{ path = "src/ai37_a2ui_catalog/mcp_app/a2ui-mcp-app.html", format = ["sdist", "wheel"] }]

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.2"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["src"]